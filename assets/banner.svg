<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    .bg-grid {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.35;
    }
    
    /* Dynamic pulsing animations */
    @keyframes pulseCircle {
      0%, 100% { r: 5px; opacity: 0.4; }
      50% { r: 9px; opacity: 1; }
    }

    @keyframes pulseRing {
      0% { r: 8px; opacity: 0.8; stroke-width: 1.5; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5; }
    }

    @keyframes lineFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(6px); }
    }

    .node-pulse-1 { animation: pulseCircle 3.5s ease-in-out infinite; }
    .node-pulse-2 { animation: pulseCircle 4.2s ease-in-out infinite 0.8s; }
    .node-pulse-3 { animation: pulseCircle 3s ease-in-out infinite 1.5s; }
    .node-ring { animation: pulseRing 3.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .data-wire {
      stroke-dasharray: 8, 8;
      animation: lineFlow 12s linear infinite;
    }
    .floating-badge {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .radar-rotator {
      transform-origin: 0 0;
      animation: radarSweep 10s linear infinite;
    }

    /* Foreground Typography - High Contrast and Stability */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }

    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <path d="M 0,50 L 1200,50 M 0,110 L 1200,110 M 0,170 L 1200,170 M 0,230 L 1200,230 M 0,290 L 1200,290 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,380 M 220,0 L 220,380 M 340,0 L 340,380 M 460,0 L 460,380 M 580,0 L 580,380 M 700,0 L 700,380 M 820,0 L 820,380 M 940,0 L 940,380 M 1060,0 L 1060,380" />
  </g>

  <!-- Decorative Background Dynamic Graph Network (Behind Text) -->
  <g opacity="0.45">
    <!-- Connecting SBOM dependency lines -->
    <line x1="880" y1="90" x2="1020" y2="150" stroke="#38bdf8" stroke-width="2" class="data-wire" />
    <line x1="1020" y1="150" x2="1120" y2="90" stroke="#818cf8" stroke-width="1.5" class="data-wire" />
    <line x1="1020" y1="150" x2="1050" y2="280" stroke="#06b6d4" stroke-width="2" class="data-wire" />
    <line x1="880" y1="90" x2="920" y2="240" stroke="#6366f1" stroke-width="1.5" class="data-wire" />
    <line x1="920" y1="240" x2="1050" y2="280" stroke="#3b82f6" stroke-width="1.5" class="data-wire" />
    <line x1="1050" y1="280" x2="1140" y2="230" stroke="#a855f7" stroke-width="1.5" class="data-wire" />
    
    <!-- Radar scanner on the right -->
    <g transform="translate(1040, 190)">
      <circle cx="0" cy="0" r="110" stroke="#1e293b" stroke-width="2" fill="none" />
      <circle cx="0" cy="0" r="75" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="40" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.6" />
      <g class="radar-rotator">
        <path d="M 0,0 L 110,0 A 110,110 0 0,0 90,-70 Z" fill="url(#cyanPurple)" opacity="0.15" />
        <line x1="0" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
      </g>
    </g>

    <!-- Animated Graph Nodes -->
    <g transform="translate(880, 90)">
      <circle cx="0" cy="0" r="12" fill="#0284c7" opacity="0.2" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" class="node-pulse-1" />
      <circle cx="0" cy="0" r="10" stroke="#38bdf8" fill="none" class="node-ring" />
    </g>
    <g transform="translate(1020, 150)">
      <circle cx="0" cy="0" r="16" fill="#6366f1" opacity="0.25" />
      <circle cx="0" cy="0" r="7" fill="#818cf8" class="node-pulse-2" />
      <circle cx="0" cy="0" r="12" stroke="#818cf8" fill="none" class="node-ring" />
    </g>
    <g transform="translate(1120, 90)">
      <circle cx="0" cy="0" r="12" fill="#a855f7" opacity="0.2" />
      <circle cx="0" cy="0" r="5" fill="#c084fc" class="node-pulse-3" />
    </g>
    <g transform="translate(920, 240)">
      <circle cx="0" cy="0" r="12" fill="#06b6d4" opacity="0.2" />
      <circle cx="0" cy="0" r="5" fill="#22d3ee" class="node-pulse-2" />
    </g>
    <g transform="translate(1050, 280)">
      <circle cx="0" cy="0" r="14" fill="#3b82f6" opacity="0.2" />
      <circle cx="0" cy="0" r="6" fill="#60a5fa" class="node-pulse-1" />
    </g>
    <g transform="translate(1140, 230)">
      <circle cx="0" cy="0" r="12" fill="#8b5cf6" opacity="0.2" />
      <circle cx="0" cy="0" r="5" fill="#a78bfa" class="node-pulse-3" />
    </g>
  </g>

  <!-- Left Accent Glow Bar -->
  <rect x="0" y="0" width="6" height="380" fill="url(#cyanPurple)" />

  <!-- Dynamic Security Shield Icon (Foreground Left) -->
  <g transform="translate(70, 75)" filter="url(#softGlow)">
    <rect x="-8" y="-8" width="86" height="86" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <!-- Shield Graphic -->
    <path d="M 35,10 L 15,22 V 44 C 15,62 35,74 35,74 C 35,74 55,62 55,44 V 22 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 28,42 L 33,47 L 43,35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles (Never Hidden) -->
  <g transform="translate(180, 105)">
    <!-- Small Category Pill -->
    <g transform="translate(0, -25)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="pill-label" fill="#38bdf8">SOFTWARE SUPPLY CHAIN</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="38" class="title-text" filter="url(#softGlow)">
      Awesome <tspan fill="url(#cyanPurple)">SBOM</tspan> Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle-text">
      Curated Directory of Enterprise SaaS, Open-Source Tools &amp; Specifications
    </text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14px" fill="#64748b">
      Software Composition Analysis (SCA) • CycloneDX &amp; SPDX • VEX • Regulatory Compliance (EO 14028 / EU CRA)
    </text>
  </g>

  <!-- Feature Pills / Standards Badges (Foreground Bottom) -->
  <g transform="translate(70, 285)">
    <g class="floating-badge">
      <!-- CycloneDX Pill -->
      <g transform="translate(0, 0)">
        <rect width="135" height="38" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" fill="#0ea5e9" />
        <text x="35" y="24" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">CycloneDX</text>
      </g>

      <!-- SPDX Pill -->
      <g transform="translate(150, 0)">
        <rect width="110" height="38" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" fill="#6366f1" />
        <text x="35" y="24" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">SPDX 3.0</text>
      </g>

      <!-- OpenVEX Pill -->
      <g transform="translate(275, 0)">
        <rect width="120" height="38" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" fill="#a855f7" />
        <text x="35" y="24" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">OpenVEX</text>
      </g>

      <!-- SCA Tools Pill -->
      <g transform="translate(410, 0)">
        <rect width="130" height="38" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" fill="#10b981" />
        <text x="35" y="24" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">SCA Scanners</text>
      </g>

      <!-- Supply Chain Security Pill -->
      <g transform="translate(555, 0)">
        <rect width="180" height="38" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <circle cx="20" cy="19" r="6" fill="#f59e0b" />
        <text x="35" y="24" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">EO 14028 / EU CRA</text>
      </g>
    </g>
  </g>
</svg>
